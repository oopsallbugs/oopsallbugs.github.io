<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Redirect GitHub Pages 404s into the SPA hash router.
      const { pathname, search, hash } = window.location
      const normalizedPath = pathname === "/404.html" ? "/" : pathname
      const redirectPath = normalizedPath === "/" ? "/" : `/#${normalizedPath}`

      window.location.replace(`${redirectPath}${search}${hash}`)
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
